<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="60">
  <defs>
    <linearGradient id="footerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070A10" stop-opacity="0" />
      <stop offset="25%" stop-color="#00FFE0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="75%" stop-color="#00FFE0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#070A10" stop-opacity="0" />
    </linearGradient>

    <filter id="footerGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes linePulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .footer-line {
      animation: linePulse 3s ease-in-out infinite;
    }
    .mono-foot {
      font-family: "JetBrains Mono", "Fira Code", monospace;
    }
  </style>

  <!-- Línea Neón de Corte -->
  <line x1="30" y1="20" x2="870" y2="20" stroke="url(#footerLineGrad)" stroke-width="2" class="footer-line" filter="url(#footerGlow)" />
  <circle cx="450" cy="20" r="4" fill="#00FFE0" filter="url(#footerGlow)" />

  <text x="450" y="44" text-anchor="middle" fill="#64748B" font-size="11" class="mono-foot" letter-spacing="2">
    // ZAK208 • ARCHITECTURE &amp; PERFORMANCE ENGINE • READY FOR NEW CHALLENGES //
  </text>
</svg>

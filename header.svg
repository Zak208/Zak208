<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="310">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10" />
      <stop offset="50%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFE0" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00FFE0" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Filtros de Brillo Neon -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 12px rgba(0, 255, 224, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 24px rgba(0, 255, 224, 0.8)); }
    }

    @keyframes liveBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(24px); }
    }

    /* Animaciones para las barras del ecualizador de audio DSP */
    @keyframes eq1 { 0%, 100% { height: 12px; y: 198px; } 50% { height: 42px; y: 168px; } }
    @keyframes eq2 { 0%, 100% { height: 28px; y: 182px; } 50% { height: 56px; y: 154px; } }
    @keyframes eq3 { 0%, 100% { height: 45px; y: 165px; } 50% { height: 20px; y: 190px; } }
    @keyframes eq4 { 0%, 100% { height: 18px; y: 192px; } 50% { height: 50px; y: 160px; } }
    @keyframes eq5 { 0%, 100% { height: 35px; y: 175px; } 50% { height: 60px; y: 150px; } }
    @keyframes eq6 { 0%, 100% { height: 52px; y: 158px; } 50% { height: 22px; y: 188px; } }
    @keyframes eq7 { 0%, 100% { height: 24px; y: 186px; } 50% { height: 48px; y: 162px; } }
    @keyframes eq8 { 0%, 100% { height: 40px; y: 170px; } 50% { height: 15px; y: 195px; } }

    .eq-bar-1 { animation: eq1 1.1s ease-in-out infinite; }
    .eq-bar-2 { animation: eq2 0.85s ease-in-out infinite 0.15s; }
    .eq-bar-3 { animation: eq3 1.25s ease-in-out infinite 0.3s; }
    .eq-bar-4 { animation: eq4 0.95s ease-in-out infinite 0.1s; }
    .eq-bar-5 { animation: eq5 1.15s ease-in-out infinite 0.25s; }
    .eq-bar-6 { animation: eq6 0.75s ease-in-out infinite 0.4s; }
    .eq-bar-7 { animation: eq7 1.05s ease-in-out infinite 0.2s; }
    .eq-bar-8 { animation: eq8 0.9s ease-in-out infinite 0.35s; }

    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .mono-text {
      font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
    }

    .live-dot {
      animation: liveBlink 1.8s ease-in-out infinite;
      transform-origin: center;
    }

    .cursor {
      animation: cursorBlink 0.9s infinite;
    }
  </style>

  <!-- Marco Exterior con Fondo Cyberpunk -->
  <rect x="2" y="2" width="896" height="306" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Patrón de Cuadrícula Sutil de Fondo -->
  <g opacity="0.08">
    <line x1="0" y1="50" x2="900" y2="50" stroke="#00FFE0" stroke-width="1" />
    <line x1="0" y1="100" x2="900" y2="100" stroke="#00FFE0" stroke-width="1" />
    <line x1="0" y1="150" x2="900" y2="150" stroke="#00FFE0" stroke-width="1" />
    <line x1="0" y1="200" x2="900" y2="200" stroke="#00FFE0" stroke-width="1" />
    <line x1="0" y1="250" x2="900" y2="250" stroke="#00FFE0" stroke-width="1" />
    <line x1="150" y1="0" x2="150" y2="310" stroke="#00FFE0" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="310" stroke="#00FFE0" stroke-width="1" />
    <line x1="450" y1="0" x2="450" y2="310" stroke="#00FFE0" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="310" stroke="#00FFE0" stroke-width="1" />
    <line x1="750" y1="0" x2="750" y2="310" stroke="#00FFE0" stroke-width="1" />
  </g>

  <!-- Barra Superior de Terminal (Window Header) -->
  <rect x="2" y="2" width="896" height="38" rx="16" fill="#0D1525" />
  <rect x="2" y="26" width="896" height="14" fill="#0D1525" />
  <line x1="2" y1="40" x2="898" y2="40" stroke="#1E293B" stroke-width="1" />

  <!-- Controles de Ventana (Dots) -->
  <circle cx="28" cy="21" r="5.5" fill="#EF4444" />
  <circle cx="46" cy="21" r="5.5" fill="#F59E0B" />
  <circle cx="64" cy="21" r="5.5" fill="#10B981" />

  <!-- Título de Terminal -->
  <text x="450" y="25" text-anchor="middle" fill="#64748B" font-size="12" class="mono-text" font-weight="500">
    zak208-core-engine // v2.6.0 [ACTIVE SESSION]
  </text>

  <!-- Indicador de Estado en Vivo (Live Badge) -->
  <g transform="translate(805, 13)">
    <rect x="0" y="0" width="72" height="16" rx="8" fill="#0F2D37" stroke="#00FFE0" stroke-width="0.75" />
    <circle cx="10" cy="8" r="3.5" fill="#00FFE0" class="live-dot" />
    <text x="20" y="11.5" fill="#00FFE0" font-size="9" class="mono-text" font-weight="bold">ONLINE</text>
  </g>

  <!-- ==================== CONTENIDO PRINCIPAL ==================== -->

  <!-- LADO IZQUIERDO: NOMBRE Y TAGLINE -->
  <g transform="translate(45, 80)">
    <!-- Insignia Superior -->
    <rect x="0" y="0" width="220" height="22" rx="4" fill="rgba(0, 255, 224, 0.08)" stroke="rgba(0, 255, 224, 0.3)" stroke-width="1" />
    <text x="12" y="15" fill="#00FFE0" font-size="11" class="mono-text" font-weight="600">⚡ FULL-STACK &amp; SYSTEMS</text>

    <!-- Título Principal ZAK208 con Neon -->
    <text x="0" y="68" fill="url(#cyanGrad)" font-size="52" class="hero-title" filter="url(#neonGlow)">
      ZAK208
    </text>

    <!-- Subtítulo de Especialidad -->
    <text x="2" y="96" fill="#F1F5F9" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">
      Álvaro • Software Engineer &amp; Creative Developer
    </text>

    <!-- Badges Técnicos Integrados -->
    <g transform="translate(0, 115)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="135" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="10" y="15" fill="#94A3B8" font-size="11" class="mono-text">🌐 Web Animada</text>

      <!-- Badge 2 -->
      <rect x="145" y="0" width="130" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="155" y="15" fill="#94A3B8" font-size="11" class="mono-text">⚡ Backend APIs</text>

      <!-- Badge 3 -->
      <rect x="285" y="0" width="135" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="295" y="15" fill="#94A3B8" font-size="11" class="mono-text">🎧 Audio DSP / USB</text>
    </g>
  </g>

  <!-- LADO DERECHO: ECUALIZADOR DSP DE AUDIO EN VIVO (Simulación 60 FPS) -->
  <g transform="translate(620, 68)">
    <!-- Caja del Motor DSP -->
    <rect x="0" y="0" width="235" height="155" rx="10" fill="#090E1A" stroke="#1E293B" stroke-width="1.2" />

    <!-- Cabecera del Panel DSP -->
    <text x="15" y="24" fill="#38BDF8" font-size="11" class="mono-text" font-weight="bold">DSP SPECTRUM ENGINE</text>
    <text x="220" y="24" text-anchor="end" fill="#64748B" font-size="10" class="mono-text">60 FPS</text>
    <line x1="12" y1="32" x2="223" y2="32" stroke="#1E293B" stroke-width="1" />

    <!-- Barras Animadas del Ecualizador -->
    <g transform="translate(20, -50)">
      <rect x="0"   y="180" width="8" height="30" rx="3" fill="url(#barGrad)" class="eq-bar-1" />
      <rect x="13"  y="170" width="8" height="40" rx="3" fill="url(#barGrad)" class="eq-bar-2" />
      <rect x="26"  y="160" width="8" height="50" rx="3" fill="url(#barGrad)" class="eq-bar-3" />
      <rect x="39"  y="175" width="8" height="35" rx="3" fill="url(#barGrad)" class="eq-bar-4" />
      <rect x="52"  y="155" width="8" height="55" rx="3" fill="url(#barGrad)" class="eq-bar-5" />
      <rect x="65"  y="165" width="8" height="45" rx="3" fill="url(#barGrad)" class="eq-bar-6" />
      <rect x="78"  y="170" width="8" height="40" rx="3" fill="url(#barGrad)" class="eq-bar-7" />
      <rect x="91"  y="150" width="8" height="60" rx="3" fill="url(#barGrad)" class="eq-bar-8" />
      <rect x="104" y="165" width="8" height="45" rx="3" fill="url(#barGrad)" class="eq-bar-2" />
      <rect x="117" y="175" width="8" height="35" rx="3" fill="url(#barGrad)" class="eq-bar-4" />
      <rect x="130" y="160" width="8" height="50" rx="3" fill="url(#barGrad)" class="eq-bar-1" />
      <rect x="143" y="170" width="8" height="40" rx="3" fill="url(#barGrad)" class="eq-bar-6" />
      <rect x="156" y="155" width="8" height="55" rx="3" fill="url(#barGrad)" class="eq-bar-3" />
      <rect x="169" y="180" width="8" height="30" rx="3" fill="url(#barGrad)" class="eq-bar-5" />
      <rect x="182" y="165" width="8" height="45" rx="3" fill="url(#barGrad)" class="eq-bar-7" />
    </g>

    <!-- Frecuencias Info -->
    <text x="18" y="142" fill="#64748B" font-size="9" class="mono-text">BASS: 98%</text>
    <text x="100" y="142" fill="#64748B" font-size="9" class="mono-text">MID: 84%</text>
    <text x="175" y="142" fill="#64748B" font-size="9" class="mono-text">TREBLE: 91%</text>
  </g>

  <!-- ==================== CONSOLA TERMINAL INFERIOR ==================== -->
  <g transform="translate(45, 236)">
    <rect x="0" y="0" width="810" height="54" rx="8" fill="#0A0F1D" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="22" fill="#38BDF8" font-size="12" class="mono-text" font-weight="bold">
      root@zak208:~$ <tspan fill="#F1F5F9" font-weight="normal">init --stack "web-animada + backend-rest + hardware-usb"</tspan>
    </text>
    <text x="16" y="42" fill="#00FFE0" font-size="11" class="mono-text">
      [READY] <tspan fill="#94A3B8">Core cargado: Python 3.12 • Node.js • React • PostgreSQL • Whisper AI • Ambilight</tspan><tspan fill="#00FFE0" class="cursor">_</tspan>
    </text>
  </g>

</svg>

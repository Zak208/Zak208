<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180">
  <defs>
    <!-- Gradiente muy sutil y orgánico de onda -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#3fb950" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    .font-main {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    /* Animación fluida de onda de audio/señal continua */
    @keyframes waveFlow {
      0% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -400;
      }
    }

    @keyframes softPulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    .wave-line {
      fill: none;
      stroke: url(#waveGrad);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 20 8 30 10 15 8;
      animation: waveFlow 18s linear infinite;
    }

    .wave-line-subtle {
      fill: none;
      stroke: #30363d;
      stroke-width: 1;
      opacity: 0.4;
    }

    .live-indicator {
      animation: softPulse 2.5s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Tarjeta contenedora sobria estilo GitHub Dark -->
  <rect x="1" y="1" width="878" height="178" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" />

  <!-- Línea base sutil de osciloscopio -->
  <line x1="40" y1="135" x2="840" y2="135" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Onda orgánica de audio / señal (Bézier suave) -->
  <path class="wave-line-subtle" d="M 40 135 C 140 135, 170 100, 240 120 C 310 140, 350 90, 420 125 C 490 155, 540 105, 620 130 C 700 155, 750 115, 840 135" />
  <path class="wave-line" d="M 40 135 C 140 135, 170 100, 240 120 C 310 140, 350 90, 420 125 C 490 155, 540 105, 620 130 C 700 155, 750 115, 840 135" />

  <!-- Nombre y rol profesional -->
  <g transform="translate(45, 48)">
    <!-- Título sobrio -->
    <text x="0" y="0" fill="#f0f6fc" font-size="28" font-weight="700" class="font-main" letter-spacing="-0.5">
      Álvaro
    </text>
    <text x="96" y="-1" fill="#8b949e" font-size="19" font-weight="400" class="font-mono">
      / Zak208
    </text>

    <!-- Subtítulo técnico claro y honesto -->
    <text x="0" y="32" fill="#8b949e" font-size="14" font-weight="400" class="font-main">
      Desarrollo Web &amp; Interfaces Animadas • Backend &amp; APIs • Software Nativo en Python
    </text>
  </g>

  <!-- Estado sutil a la derecha -->
  <g transform="translate(730, 44)">
    <circle cx="10" cy="5" r="4" fill="#3fb950" class="live-indicator" />
    <text x="22" y="9" fill="#8b949e" font-size="12" class="font-mono">disponible</text>
  </g>
</svg>
